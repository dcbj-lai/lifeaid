name: lifeaid

services:
  app:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
